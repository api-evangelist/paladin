name: Paladin
description: >-
  Paladin is a legal technology company whose software platform connects the
  pro bono community and empowers legal teams to run pro bono programs more
  efficiently. The platform provides centralized program management dashboards,
  volunteer matching that connects attorneys to pro bono opportunities based on
  interest and expertise, and impact measurement that visualizes and reports on
  program outcomes across a nationwide network of legal services organizations,
  law firms, in-house legal teams, law schools, and bar associations. Customers
  include Clifford Chance, Dentons, Holland & Knight, and Wilson Sonsini.
  Paladin is a Techstars portfolio company. It exposes a customer-facing web
  application at app.joinpaladin.com but does not publish a public developer
  API, OpenAPI specification, SDKs, or developer documentation at this time.
